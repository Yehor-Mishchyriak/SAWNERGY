name: Test

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  selection:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.select.outputs.groups }}
      run_tests: ${{ steps.select.outputs.run_tests }}
      run_torch: ${{ steps.select.outputs.run_torch }}
      full: ${{ steps.select.outputs.full }}
      markexpr: ${{ steps.select.outputs.markexpr }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select affected test groups
        id: select
        env:
          SAWNERGY_FULL_SUITE: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
          SAWNERGY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SAWNERGY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 CICD/select_tests.py

  tests:
    needs: selection
    # Keep both matrix check names present, even for documentation-only changes.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      RUN_TESTS: ${{ needs.selection.result != 'success' || needs.selection.outputs.run_tests == 'true' }}
      SAWNERGY_TEST_GROUPS: ${{ needs.selection.result == 'success' && needs.selection.outputs.groups || '["all"]' }}
      PYTEST_MARKEXPR: ${{ needs.selection.result == 'success' && needs.selection.outputs.markexpr || '' }}
    steps:
      - name: No affected tests
        if: env.RUN_TESTS != 'true'
        run: echo "No runtime or test changes; tests are not needed."

      - name: Checkout repository
        if: env.RUN_TESTS == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.RUN_TESTS == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        if: env.RUN_TESTS == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        if: env.RUN_TESTS == 'true'
        run: python -m pytest tests -m "$PYTEST_MARKEXPR"

  tests_torch:
    needs: selection
    # Missing/failed selection falls back to a full run in both jobs.
    if: ${{ !cancelled() && (needs.selection.result != 'success' || needs.selection.outputs.run_torch == 'true') }}
    runs-on: ubuntu-latest
    env:
      SAWNERGY_TEST_GROUPS: ${{ needs.selection.result == 'success' && needs.selection.outputs.groups || '["all"]' }}
      PYTEST_MARKEXPR: ${{ needs.selection.result == 'success' && needs.selection.outputs.full == 'false' && 'torch' || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (torch backend)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install "torch>=2.0"

      - name: Run tests (torch backend available)
        run: python -m pytest tests -m "$PYTEST_MARKEXPR"
